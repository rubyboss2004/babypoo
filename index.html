<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<style>
/* ============================================================
   寶寶勇士譜夾 · 前台
   設計規格 v3。改顏色、改字，都只改下面這一段 :root。
   ============================================================ */
:root{
  color-scheme:light;                /* 手機開深色模式也維持淺色 */

  --ground:#EFEEF3;
  --au1:rgba(94,88,224,.16);
  --au2:rgba(224,92,142,.11);
  --au3:rgba(88,182,214,.11);

  --glass:rgba(255,255,255,.72);
  --glass-2:rgba(255,255,255,.50);
  --glass-hi:rgba(255,255,255,.85);
  --glass-edge:rgba(23,22,29,.09);

  --paper:#FFFFFF;
  --ink:#17161D;
  --ink-2:#4C4A58;
  --muted:#8A8797;

  --brand:#4340B8;
  --brand-soft:rgba(67,64,184,.10);
  --on-brand:#FFFFFF;

  --chord:#D0326A;
  --chord-soft:rgba(208,50,106,.10);

  --rule:rgba(23,22,29,.10);
  --rule-2:rgba(23,22,29,.16);
  --shadow:0 1px 1px rgba(23,22,29,.04), 0 12px 32px -16px rgba(23,22,29,.28);
  --glow:inset 0 1px 0 rgba(255,255,255,.75);

  --f-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-s:8px; --r-m:12px; --r-c:14px; --r-l:20px;

  /* 手機系統空間 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}

.app{position:fixed;inset:0;overflow:hidden;background:var(--ground);
  padding-left:var(--sal);padding-right:var(--sar)}
.aurora{position:absolute;inset:-25%;z-index:0;pointer-events:none;filter:blur(64px)}
.aurora i{position:absolute;display:block;border-radius:50%}
.aurora .a1{width:62%;height:38%;left:-8%;top:2%;background:var(--au1)}
.aurora .a2{width:70%;height:42%;right:-14%;bottom:4%;background:var(--au2)}
.aurora .a3{width:52%;height:32%;right:-6%;top:28%;background:var(--au3)}

/* ---------- 索引頁 ---------- */
.binder{position:absolute;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto}
.topbar{
  position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;
  padding:calc(12px + var(--sat)) 14px 12px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--glass-edge);
}
.topbar>.inner{max-width:720px;margin:0 auto;width:100%;display:flex;align-items:center;gap:8px}
.brandmark{width:40px;height:40px;flex:none;object-fit:contain;margin-right:2px}
.mark{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.mark .eyebrow{font-family:var(--f-mono);font-size:10px;font-weight:500;
  letter-spacing:.22em;color:var(--brand);text-transform:uppercase}
.mark .name{font-size:16.5px;font-weight:600;letter-spacing:-.015em}
.ico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent}
.ico:hover{background:var(--glass-2);border-color:var(--glass-edge)}
.ico[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.ico svg{width:19px;height:19px}

.index{padding:14px 14px calc(30px + var(--sab))}
.searchrow{margin-bottom:12px}
.searchrow.hidden{display:none}
.field{display:flex;align-items:center;gap:9px;border-radius:var(--r-m);padding:0 13px;
  background:var(--glass);border:1px solid var(--rule-2)}
.field svg{width:16px;height:16px;color:var(--muted);flex:none}
.field input{flex:1;border:none;background:none;outline:none;padding:11px 0;min-width:0;font-size:16px}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

.chips{display:flex;gap:6px;margin-bottom:16px}
.chip{padding:6px 14px;border-radius:999px;font-size:13px;
  background:var(--glass);border:1px solid var(--glass-edge);color:var(--ink-2);box-shadow:var(--glow)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:var(--on-brand);box-shadow:none}

.tabs-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.tabs-head h2{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.tabs-head .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.tab-list{display:flex;flex-direction:column;gap:8px}
.tab{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px;border-radius:var(--r-c);
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),var(--glow);
  transition:transform .12s ease, background .12s ease;
}
.tab:hover{background:var(--glass-hi)}
.tab:active{transform:scale(.985)}
.tab .body{flex:1;min-width:0}
.tab .t{font-size:15.5px;font-weight:600;letter-spacing:-.012em;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tab .m{font-size:12px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.pill{font-size:10px;font-weight:600;letter-spacing:.06em;padding:2.5px 7px;border-radius:5px;line-height:1.5}
.pill.new{background:var(--brand-soft);color:var(--brand)}
.keychip{font-family:var(--f-mono);font-size:16px;font-weight:500;color:var(--brand);
  min-width:32px;text-align:right;flex:none;letter-spacing:-.01em}
.tab .go{color:var(--rule-2);flex:none;display:flex}
.tab .go svg{width:15px;height:15px}

/* 「我想要新的譜」：清單最上面一條實心的靛色，不可能看不到 */
.askbig{
  width:100%;margin-bottom:14px;padding:14px 16px;border-radius:var(--r-c);
  background:var(--brand);color:var(--on-brand);
  display:flex;align-items:center;gap:11px;text-align:left;
  box-shadow:0 1px 1px rgba(23,22,29,.06), 0 10px 24px -12px rgba(67,64,184,.7);
  transition:transform .12s ease, filter .12s ease;
}
.askbig:hover{filter:brightness(1.08)}
.askbig:active{transform:scale(.985)}
.askbig svg{width:19px;height:19px;flex:none}
.askbig b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;flex:1}
.askbig .go{opacity:.7;width:15px;height:15px}

.askcard{
  width:100%;margin-top:14px;padding:15px 14px;border-radius:var(--r-c);text-align:left;
  background:var(--glass-2);border:1px dashed var(--rule-2);
  display:flex;align-items:center;gap:12px;color:var(--ink-2);
}
.askcard:hover{background:var(--glass);border-style:solid}
.askcard .plus{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand)}
.askcard .plus svg{width:16px;height:16px}
.askcard b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.askcard span{font-size:12.5px;color:var(--muted)}

.empty,.loading{text-align:center;color:var(--muted);font-size:14px;padding:44px 16px;
  border:1px dashed var(--rule-2);border-radius:var(--r-m);background:var(--glass-2)}
.foot{padding:22px 16px calc(8px + var(--sab));text-align:center;font-size:12px;color:var(--muted)}

/* ---------- 譜頁 ---------- */
.sheetview{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;background:var(--ground)}
.sheetview[hidden]{display:none}
.sheet-top{
  position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:9px;
  padding:calc(11px + var(--sat)) 14px 11px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--glass-edge);
}
.sheet-top .inner{max-width:720px;margin:0 auto;width:100%;display:flex;align-items:center;gap:9px}
.sheet-top .title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sheet-top .title .t{font-size:15px;font-weight:600;letter-spacing:-.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-top .title .m{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.keybar{
  position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;
  background:var(--glass-2);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--glass-edge);
}
.keybar .inner{max-width:720px;margin:0 auto;width:100%;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.keybar[hidden]{display:none}
.step{width:36px;height:36px;border-radius:11px;flex:none;
  border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--glow);
  font-size:17px;font-weight:500;color:var(--ink-2);display:grid;place-items:center;line-height:1}
.step:hover{color:var(--brand);border-color:var(--brand)}
.nowkey{font-family:var(--f-mono);font-size:27px;font-weight:600;line-height:1;
  color:var(--chord);min-width:58px;text-align:center;letter-spacing:-.03em}
.keymeta{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.keymeta .capo{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-weight:500}
.keymeta .orig{font-size:11px;color:var(--muted)}
.krt{display:flex;gap:6px;margin-left:auto;flex:none}
.tiny{height:32px;min-width:36px;padding:0 9px;border-radius:9px;
  border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--glow);
  font-size:12.5px;color:var(--ink-2)}
.tiny:hover{color:var(--brand);border-color:var(--brand)}
.tiny.reset{color:var(--chord)}
.tiny[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
.imgnote{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

.stage{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:14px 14px calc(78px + var(--sab));-webkit-overflow-scrolling:touch}
.paper{max-width:720px;margin:0 auto;
  background:var(--paper);border:1px solid var(--glass-edge);border-radius:var(--r-m);
  box-shadow:var(--shadow);padding:20px 18px 24px;overflow-x:auto}
.paper.pic{padding:10px}
.paper img{display:block;width:100%;height:auto;border-radius:var(--r-s)}
.paper.turn-l{animation:tl .17s ease-in forwards}
.paper.turn-r{animation:tr .17s ease-in forwards}
.paper.land-l{animation:ll .24s ease-out}
.paper.land-r{animation:lr .24s ease-out}
@keyframes tl{to{transform:translateX(-14%);opacity:0}}
@keyframes tr{to{transform:translateX(14%);opacity:0}}
@keyframes ll{from{transform:translateX(14%);opacity:0}}
@keyframes lr{from{transform:translateX(-14%);opacity:0}}
@media(prefers-reduced-motion:reduce){
  .tab{transition:none}.tab:active{transform:none}
  .paper.turn-l,.paper.turn-r,.paper.land-l,.paper.land-r{animation:none}
}

.sec{display:flex;align-items:center;gap:10px;margin:26px 0 9px}
.sec:first-child{margin-top:0}
.sec-t{font-weight:600;color:var(--brand);background:var(--brand-soft);
  padding:3px 10px;border-radius:6px;letter-spacing:.06em;white-space:nowrap}
.sec-r{flex:1;height:1px;background:var(--rule)}
.ln{margin-bottom:2px}
.u{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:top}
.cd{font-style:normal;font-family:var(--f-mono);font-weight:600;color:var(--chord);
  white-space:nowrap;padding-right:.5em;letter-spacing:-.02em}
.tx{font-style:normal;white-space:pre;color:var(--ink)}
.tx.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-right:.3em;color:var(--muted)}
.credit{font-size:11px;color:var(--muted);text-align:center;
  margin-top:24px;padding-top:11px;border-top:1px solid var(--rule)}

.flipbar{
  position:absolute;left:0;right:0;bottom:0;z-index:5;padding-bottom:var(--sab);
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border-top:1px solid var(--glass-edge);
}
.flipbar .inner{max-width:720px;margin:0 auto;display:flex;align-items:stretch}
.flip{flex:1;min-width:0;padding:11px 12px;display:flex;align-items:center;gap:8px;
  color:var(--ink-2);font-size:13px}
.flip:hover:not(:disabled){color:var(--brand);background:var(--glass-hi)}
.flip:disabled{opacity:.35;cursor:default}
.flip.next{justify-content:flex-end;text-align:right}
.flip svg{width:15px;height:15px;flex:none}
.flip .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{display:grid;place-items:center;padding:0 13px;flex:none;
  font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.save{background:var(--brand);color:var(--on-brand);padding:0 17px;display:grid;place-items:center;flex:none;
  min-width:52px}
.save:disabled{opacity:.6}
.save svg{width:17px;height:17px}

/* ---------- 抽屜 ---------- */
/* 抽屜：四邊都跟螢幕邊界留開，是一張浮起來的卡，不是黏在底部的板子 */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,10,16,.45);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  padding:calc(16px + var(--sat)) calc(12px + var(--sal)) calc(12px + var(--sab)) calc(12px + var(--sar))}
.scrim[hidden]{display:none}
.drawer{
  position:relative;width:100%;max-width:640px;max-height:100%;overflow-y:auto;
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-hi);border-radius:var(--r-l);
  box-shadow:0 24px 60px -20px rgba(23,22,29,.5);
  padding:22px 18px 24px;
}
.drawer h3{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;padding-right:34px}
.drawer .lead{font-size:14px;color:var(--muted);margin-bottom:6px;line-height:1.7}

/* 說明的每一段自己一張小卡，眼睛才有地方落腳 */
.hsec{background:var(--paper);border:1px solid var(--glass-edge);border-radius:var(--r-m);
  padding:14px 16px 15px;margin-top:10px}
.drawer h4{
  font-family:var(--f-ui);font-size:15.5px;font-weight:700;color:var(--ink);
  letter-spacing:-.01em;text-transform:none;margin:0 0 7px;
  display:flex;align-items:center;gap:9px;
}
.drawer h4::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand);flex:none}
.drawer p,.drawer li{font-size:14px;color:var(--ink-2);line-height:1.75}
.drawer p+p{margin-top:7px}
.drawer ul,.drawer ol{padding-left:19px;margin-top:5px}
.drawer li{margin-bottom:2px}
.drawer strong{color:var(--ink);font-weight:600}
.close-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;
  background:var(--glass-2);border:1px solid var(--rule-2);display:grid;place-items:center;color:var(--ink-2);z-index:2}
.close-x:hover{background:var(--paper);color:var(--ink)}
.close-x svg{width:14px;height:14px}
.drawer .field{margin-bottom:12px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{padding:10px 18px;border-radius:10px;font-size:14px;
  border:1px solid var(--rule-2);background:var(--glass);color:var(--ink-2)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:500}
.btn:disabled{opacity:.6}
.status{font-size:13px;margin-top:10px;min-height:20px}
.status.ok{color:var(--brand)}
.status.err{color:var(--chord)}
.htabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.htab{padding:6px 12px;border-radius:999px;border:1px solid var(--glass-edge);
  background:var(--glass);font-size:13px;color:var(--ink-2)}
.htab[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
.htc{display:none;background:var(--ground);padding:12px 14px;border-radius:var(--r-s);
  border:1px solid var(--rule)}
.htc.on{display:block}
.htabs{margin-top:2px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="q" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></symbol>
<symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></symbol>
<symbol id="dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></symbol>
</defs></svg>

<div class="app">
  <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

  <div class="binder" id="binder">
    <header class="topbar">
      <div class="inner">
        <img class="brandmark" src="logo.png" alt="" width="256" height="256">

<script>
/* ============================================================
   後端網址。GAS 重新部署後如果網址換了，只改這一行。
   ============================================================ */
const BASE = 'https://script.google.com/macros/s/AKfycbwDzqeKKe-ER3OoipeptQXPe2izLp7YU0PZNYHPulaqIDdiHC7e_ZTWUmvpB4zr0nV_/exec';

/* ---------- 樂理 ---------- */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PC={'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,'E#':5,'F':5,
          'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11};
const MAJ=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MIN=['Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m','Am','Bbm','Bm'];
const FLAT_KEYS=new Set(['Db','Eb','F','Ab','Bb','Gb','Cm','Dm','Ebm','Fm','Gm','Bbm']);
const EASY_MAJ=[0,7,2,9,4], EASY_MIN=[9,4,2];
const mod12=n=>((n%12)+12)%12;
const normNote=n=>n.charAt(0).toUpperCase()+n.slice(1).replace(/B/g,'b');
function parseKey(k){const m=String(k||'C').trim().match(/^([A-G][#b]?)\s*(m|min|minor)?$/i);
  if(!m||PC[normNote(m[1])]===undefined)return{pc:0,minor:false};
  return{pc:PC[normNote(m[1])],minor:!!m[2]};}
const keyName=(pc,mi)=>mi?MIN[pc]:MAJ[pc];
function curKey(base,steps){const o=parseKey(base);const pc=mod12(o.pc+steps);
  return{pc,minor:o.minor,name:keyName(pc,o.minor)};}
function shift(note,n,arr){const i=PC[normNote(note)];return i===undefined?note:arr[mod12(i+n)];}
function transposeChord(ch,n,arr){ if(!n)return ch;
  return String(ch).replace(/^([A-G][#b]?)/,r=>shift(r,n,arr))
                   .replace(/\/([A-G][#b]?)/,(_,b)=>'/'+shift(b,n,arr)); }
function bestCapo(base,steps){
  const t=curKey(base,steps), pref=t.minor?EASY_MIN:EASY_MAJ, opts=[];
  for(let n=0;n<=7;n++){const s=mod12(t.pc-n); if(pref.indexOf(s)>=0)opts.push({n,shape:keyName(s,t.minor)});}
  if(!opts.length||opts.some(o=>o.n===0))return null;
  const near=opts.filter(o=>o.n<=5);
  return (near.length?near:opts).sort((a,b)=>
    pref.indexOf(mod12(t.pc-a.n))-pref.indexOf(mod12(t.pc-b.n))||a.n-b.n)[0];
}

/* ---------- ChordPro ---------- */
const chars=t=>Array.from(String(t));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseLine(raw){let text='',list=[],i=0;
  while(i<raw.length){ if(raw[i]==='['){const j=raw.indexOf(']',i);
    if(j<0){text+=raw[i];i++;continue;}
    list.push({i:chars(text).length,c:raw.slice(i+1,j).trim()});i=j+1;}
    else{text+=raw[i];i++;} }
  return{text,chords:list};}
function parseChordPro(src){
  const secs=[]; let cur=null, meta={};
  String(src).split('\n').forEach(raw=>{
    const d=raw.trim().match(/^\{([^:}]+)(?::\s*([\s\S]*))?\}$/);
    if(d){ const n=d[1].trim().toLowerCase(), v=(d[2]||'').trim();
      if(n==='key')meta.key=v; else if(n==='copyright'||n==='ccli')meta.copyright=v;
      else if(n==='start_of_verse'||n==='sov'){cur={name:v||'主歌',lines:[]};secs.push(cur);}
      else if(n==='start_of_chorus'||n==='soc'){cur={name:v||'副歌',lines:[]};secs.push(cur);}
      else if(n==='start_of_bridge'||n==='sob'){cur={name:v||'橋段',lines:[]};secs.push(cur);}
      return; }
    if(!raw.trim())return;
    if(!cur){cur={name:'',lines:[]};secs.push(cur);}
    cur.lines.push(parseLine(raw));
  });
  return {sections:secs, meta};
}
// 一排和弦底下疊好幾段歌詞：檔案裡存成「1. 帶和弦」＋「2. 3. 沒和弦」的連續行，
// 這裡把它們併回同一組，第 2 段之後的和弦「留寬度但不顯示」，字才會對得齊。
function groupLines(lines){
  const out=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    const m=String(L.text).match(/^\s*1\s*[.、．]\s*/);
    if(L.chords.length && m){
      const alts=[]; let j=i+1;
      while(j<lines.length){
        const N=lines[j], mm=String(N.text).match(/^\s*(\d+)\s*[.、．]\s*/);
        if(N.chords.length || !mm) break;
        alts.push(N.text.replace(mm[0],'')); j++;
      }
      if(alts.length){
        const cut=chars(m[0]).length;      // 拿掉「1. 」之後，和弦位置也要跟著左移
        out.push({ text:L.text.replace(m[0],''),
                   chords:L.chords.map(c=>({c:c.c,i:Math.max(0,c.i-cut)})), alts:alts });
        i=j-1; continue;
      }
    }
    out.push({ text:L.text, chords:L.chords, alts:[] });
  }
  return out;
}

function sheetHtml(song,steps,fs,print){
  const arr = FLAT_KEYS.has(curKey(song._base,steps).name) ? FLAT : SHARP;
  const cs2=Math.round(fs*0.76), ss=Math.round(fs*0.78);
  const cdh=Math.round(cs2*1.4), lh=Math.round(fs*1.5);
  const ink = print ? ';color:#000' : '';
  const secStyle = print
    ? `font-size:${ss}px;font-weight:600;color:#000;background:#EEE;padding:3px 10px;border-radius:6px;letter-spacing:.06em;white-space:nowrap`
    : `font-size:${ss}px`;
  let h='';
  song._p.sections.forEach(sec=>{
    if(sec.name) h+=`<div class="sec"><span class="sec-t" style="${secStyle}">${esc(sec.name)}</span><span class="sec-r"></span></div>`;
    if(!sec._g) sec._g = groupLines(sec.lines);
    sec._g.forEach(l=>{
      const map={}; l.chords.forEach(c=>{map[c.i]=c.c;});
      let N=chars(l.text).length;
      l.alts.forEach(t=>{ N=Math.max(N, chars(t).length); });
      l.chords.forEach(c=>{ N=Math.max(N, c.i+1); });

      const row=(txt,ghost,num)=>{
        const cs=chars(txt);
        const cdStyle = ghost
          ? `font-size:${cs2}px;height:0;line-height:0;overflow:hidden;visibility:hidden${ink}`
          : `font-size:${cs2}px;height:${cdh}px;line-height:${cdh}px${ink}`;
        const txStyle = `font-size:${fs}px;line-height:${lh}px${ink}`;
        let u = num ? `<span class="u"><i class="cd" style="${cdStyle}"></i><i class="tx num" style="${txStyle}">${num}.</i></span>` : '';
        for(let i=0;i<N;i++){
          const ch=map[i];
          const g = i<cs.length ? (cs[i]===' '?'&nbsp;':esc(cs[i])) : '&nbsp;';
          u+=`<span class="u"><i class="cd" style="${cdStyle}">${ch?esc(transposeChord(ch,steps,arr)):''}</i>`+
             `<i class="tx" style="${txStyle}">${g}</i></span>`;
        }
        return `<div class="ln">${u||'&nbsp;'}</div>`;
      };

      h += row(l.text, false, l.alts.length ? 1 : 0);
      l.alts.forEach((t,k)=>{ h += row(t, true, k+2); });
    });
  });
  const cr = song.copyright || song._p.meta.copyright;
  if(cr) h+=`<div class="credit"${print?' style="color:#555"':''}>${esc(cr)}</div>`;
  return h;
}

/* ============================================================
   狀態
   ============================================================ */
let SONGS=[], filter='all', query='', order=[], idx=0;
const view={};
const st=id=>view[id]||(view[id]={steps:0,fs:17,mode:null});
const $=s=>document.querySelector(s);
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

function prep(s){
  const cp=String(s.chordpro||'').trim();
  s._has=!!cp;
  if(cp){ s._p=parseChordPro(cp);
    s._base=s._p.meta.key||s.key||'C';
    s._ly=s._p.sections.map(x=>x.lines.map(l=>l.text).join('')).join(''); }
  else { s._ly=''; }
  // 圖片：主圖 → 預設調的圖 → 任何一張。API v3 的 images{} 有就用，沒有就自己找欄位。
  const KEYS=['C','D','E','F','G','A','B'];
  const imgs = (s.images && typeof s.images==='object') ? s.images : null;
  const pick = k => String((imgs && imgs[k]) || s['imageUrl_'+k] || '').trim();
  s._img = String(s.imageUrl||'').trim();
  if(!s._img) s._img = pick(String(s.defaultKey||s.key||'').replace(/m$/i,''));
  if(!s._img){ for(const k of KEYS){ const u=pick(k); if(u){ s._img=u; break; } } }
}

async function load(){
  try{
    const d=await(await fetch(BASE+'?api=list')).json();
    if(!d.success) throw new Error(d.error||'後端回報失敗');
    SONGS=(d.songs||[]).slice().reverse();
    SONGS.forEach(prep);
    renderIndex();
  }catch(e){
    $('#tabs').innerHTML='<div class="empty">連不上樂譜庫：'+esc(e.message)+
      '<br><br>檢查一下網路，或稍後再試一次。</div>';
  }
}

function visible(){
  const q=query.trim().toLowerCase();
  return SONGS.filter(s=>{
    const mq=!q||String(s.title||'').toLowerCase().includes(q)
      ||String(s.artist||'').toLowerCase().includes(q)
      ||(s._ly||'').toLowerCase().includes(q);
    return mq && (filter==='all'||s.type===filter);
  });
}

function renderIndex(){
  const list=visible();
  $('#count').textContent = list.length ? list.length+' 首' : '';
  const box=$('#tabs');
  if(!list.length){ box.className=''; box.innerHTML='<div class="empty">沒有找到符合的譜</div>'; return; }
  box.className='tab-list';
  box.innerHTML=list.map((s,i)=>`
    <button class="tab" data-id="${esc(s.id)}">
      <span class="body">
        <span class="t">${esc(s.title)}
          ${i===0&&!query&&filter==='all'?'<span class="pill new">最新</span>':''}</span>
        <span class="m">${[esc(s.artist||''),esc(s.type||''),s.bpm?esc(s.bpm)+' BPM':''].filter(Boolean).join(' · ')}</span>
      </span>
      <span class="keychip">${esc(s.key||'')}</span>
      <span class="go"><svg><use href="#r"/></svg></span>
    </button>`).join('');
}

/* ---------- 譜頁 ---------- */
function openSong(id){
  order=visible(); idx=Math.max(0,order.findIndex(s=>String(s.id)===String(id)));
  $('#sheetView').hidden=false; renderSheet(); $('#bBack').focus();
}
function closeSong(){
  $('#sheetView').hidden=true;
  const t=document.querySelector('.tab[data-id="'+(order[idx]&&order[idx].id)+'"]');
  if(t) t.focus();
}
function modeOf(s,v){ return v.mode || (s._has?'text':'img'); }

function renderSheet(){
  const s=order[idx]; if(!s) return closeSong();
  const v=st(s.id), mode=modeOf(s,v);
  $('#stTitle').textContent=s.title||'';
  $('#stMeta').textContent=[s.artist,s.type,s.bpm?s.bpm+' BPM':''].filter(Boolean).join(' · ');
  $('#pos').textContent=(idx+1)+' / '+order.length;
  const p=order[idx-1], n=order[idx+1];
  $('#bPrev').disabled=!p; $('#prevLab').textContent=p?p.title:'第一首';
  $('#bNext').disabled=!n; $('#nextLab').textContent=n?n.title:'最後一首';

  const paper=$('#paper');
  if(mode==='text' && s._has){
    $('#keybar').hidden=false; $('#picbar').hidden=true;
    const k=curKey(s._base,v.steps), capo=bestCapo(s._base,v.steps);
    $('#nowKey').textContent=k.name;
    $('#capo').textContent = capo ? 'Capo '+capo.n+' · 按 '+capo.shape : '不用夾 capo';
    $('#orig').textContent = v.steps ? '原調 '+keyName(parseKey(s._base).pc,parseKey(s._base).minor) : '譜上原本的調';
    $('#bReset').hidden = !v.steps;
    $('#bMode').hidden = !s._img;
    paper.className='paper';
    paper.innerHTML=sheetHtml(s,v.steps,v.fs,false);
  } else if(s._img){
    $('#keybar').hidden=true; $('#picbar').hidden=false;
    $('#picNote').textContent='圖片版'+(s.defaultKey||s.key?' · 固定 '+(s.defaultKey||s.key)+' 調':'');
    $('#bMode2').hidden = !s._has;
    paper.className='paper pic';
    paper.innerHTML='<img src="'+esc(s._img)+'" alt="'+esc(s.title)+'">';
  } else {
    $('#keybar').hidden=true; $('#picbar').hidden=true;
    paper.className='paper';
    paper.innerHTML='<div class="empty" style="border:none;background:none">這首還沒有譜</div>';
  }
  $('#bSave').disabled = !(s._has || s._img);
}

function flip(dir){
  const to=idx+dir; if(to<0||to>=order.length) return;
  const paper=$('#paper');
  if(reduce()){ idx=to; renderSheet(); $('#stage').scrollTop=0; return; }
  const out=dir>0?'turn-l':'turn-r', land=dir>0?'land-l':'land-r';
  paper.classList.add(out);
  setTimeout(()=>{
    idx=to; renderSheet(); $('#stage').scrollTop=0;
    paper.classList.remove(out); paper.classList.add(land);
    setTimeout(()=>paper.classList.remove(land),240);
  },170);
}
function bump(d){ const v=st(order[idx].id); v.steps=Math.max(-11,Math.min(11,v.steps+d)); renderSheet(); }
function size(d){ const v=st(order[idx].id); v.fs=Math.max(13,Math.min(30,v.fs+d*2)); renderSheet(); }
function setMode(m){ st(order[idx].id).mode=m; renderSheet(); $('#stage').scrollTop=0; }

/* ---------- 下載 ---------- */
async function save(){
  const s=order[idx], v=st(s.id), btn=$('#bSave');
  if(modeOf(s,v)==='img' || !s._has){ return dlImage(s); }
  if(typeof html2canvas==='undefined'){ alert('出圖元件沒載入，確認有網路再試一次'); return; }
  btn.disabled=true;
  try{
    const k=curKey(s._base,v.steps).name, capo=bestCapo(s._base,v.steps);
    const meta=[s.artist,'Key: '+k,s.bpm?'BPM: '+s.bpm:''].filter(Boolean).join('　·　');
    const box=document.createElement('div');
    box.style.cssText='position:fixed;left:-9999px;top:0;width:660px;background:#fff;'+
      'padding:30px 34px 34px;color:#000;font-family:'+getComputedStyle(document.body).fontFamily;
    box.innerHTML=
      '<div style="text-align:center;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid #000">'+
        '<div style="font-size:26px;font-weight:700">'+esc(s.title)+'</div>'+
        '<div style="font-size:14px;margin-top:4px">'+esc(meta)+'</div>'+
        (capo?'<div style="font-size:13px;margin-top:3px">Capo '+capo.n+'　按 '+capo.shape+' 的指型</div>':'')+
      '</div>'+ sheetHtml(s,v.steps,19,true);
    document.body.appendChild(box);
    const c=await html2canvas(box,{scale:2,backgroundColor:'#ffffff'});
    document.body.removeChild(box);
    await shareOrDownload(c.toDataURL('image/png'), s.title+'_'+k+'.png', s.title);
  }catch(e){ alert('產生圖片失敗：'+e.message); }
  finally{ btn.disabled=false; }
}
async function dlImage(s){
  try{
    const blob=await(await fetch(s._img)).blob();
    if(await shareBlob(blob,s.title+'.png',s.title)) return;
  }catch(e){}
  download(s._img, s.title+'.png');
}
async function shareOrDownload(dataUrl,name,title){
  try{
    const blob=await(await fetch(dataUrl)).blob();
    if(await shareBlob(blob,name,title)) return;
  }catch(e){}
  download(dataUrl,name);
}
async function shareBlob(blob,name,title){
  if(!(navigator.share&&navigator.canShare)) return false;
  const file=new File([blob],name,{type:'image/png'});
  if(!navigator.canShare({files:[file]})) return false;
  try{ await navigator.share({files:[file],title:title}); return true; }
  catch(e){ return e && e.name==='AbortError'; }
}
function download(href,name){
  const a=document.createElement('a');
  a.href=href; a.download=name; a.target='_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- 抽屜 ---------- */
function openDrawer(html){
  $('#drawerBody').innerHTML=html; $('#drawer').hidden=false; $('#drawerBody').scrollTop=0;
  const f=$('#drawerBody').querySelector('input,[data-close]'); if(f) f.focus();
}
function closeDrawer(){ $('#drawer').hidden=true; }

const ASK=`<button class="close-x" data-close aria-label="關閉"><svg><use href="#x"/></svg></button>
<h3>我想要新的譜</h3>
<div class="lead">告訴老師你想要哪首歌，老師會收到通知，盡快寫好上傳。</div>
<label class="field"><svg><use href="#s"/></svg>
  <input id="askInput" type="text" placeholder="請輸入歌名" autocomplete="off"></label>
<div class="acts"><button class="btn" data-close>取消</button>
  <button class="btn primary" id="askSend">送出</button></div>
<div class="status" id="askStatus"></div>`;

const HELP=`<button class="close-x" data-close aria-label="關閉"><svg><use href="#x"/></svg></button>
<h3>怎麼用這個樂譜庫</h3>
<div class="lead">老師整理的詩歌譜，給寶寶勇士的樂手練習用。看完這五段就會用了。</div>

<div class="hsec"><h4>看譜</h4>
<p>點清單上的歌名，整頁譜就翻出來。左上角 <strong>‹</strong> 回到清單。</p></div>

<div class="hsec"><h4>不好按？自己換調</h4>
<p>譜上面那排：<strong>−</strong> <strong>+</strong> 升降半音，<strong>粉紅色大字</strong>就是現在的調。旁邊會告訴你要夾第幾格、按哪個調的指型。改過之後會出現「回原調」。</p>
<p><strong>A−</strong> <strong>A+</strong> 是調字的大小，站遠一點也看得到。</p></div>

<div class="hsec"><h4>翻到下一首</h4>
<p>最下面那排可以直接翻前後一首，手機上<strong>左右滑</strong>也行。電腦用 <strong>←</strong> <strong>→</strong>，按 <strong>Esc</strong> 回清單。</p></div>

<div class="hsec"><h4>存到手機相簿</h4>
<p>右下角的下載鍵。存下來的是<strong>你現在轉到的那個調</strong>，不是原本的調。手機會跳出分享，選「儲存影像」就進相簿。</p></div>

<div class="hsec"><h4>找不到想要的歌</h4>
<p>按清單最上面那條<strong>「我想要新的譜」</strong>，輸入歌名送出，老師會收到通知。</p>
<p>搜尋也可以<strong>直接打歌詞</strong>找，不一定要記得歌名。</p></div>

<div class="hsec"><h4>看老師排好的圖</h4>
<p>有些歌除了文字譜，也有老師原本排好的圖。這種歌在轉調那排的右邊會出現「<strong>圖</strong>」，按下去可以切過去看；在圖片版按「<strong>文字</strong>」就切回來。</p></div>

<div class="hsec"><h4>加到主畫面，下次更快打開</h4>
<div class="htabs">
  <button class="htab" data-tab="ios" aria-pressed="true">iPhone</button>
  <button class="htab" data-tab="android" aria-pressed="false">Android</button>
  <button class="htab" data-tab="pc" aria-pressed="false">電腦</button>
</div>
<div class="htc on" id="t-ios">
  <ol><li>用 <strong>Safari</strong> 打開（不要用 LINE 內建的瀏覽器）</li>
  <li>按下方中間的<strong>分享</strong>鍵</li>
  <li>往下捲，選「<strong>加入主畫面</strong>」</li>
  <li>按右上角「<strong>新增</strong>」</li></ol></div>
<div class="htc" id="t-android">
  <ol><li>用 <strong>Chrome</strong> 打開</li><li>按右上角「<strong>⋮</strong>」</li>
  <li>選「<strong>加到主畫面</strong>」</li><li>按「新增」</li></ol></div>
<div class="htc" id="t-pc">
  <ol><li>網址列右邊找「<strong>安裝</strong>」的圖示</li><li>按下去 →「<strong>安裝</strong>」</li></ol>
  <p style="color:var(--muted)">沒看到的話，加書籤也可以。</p></div>
</div>

<div class="hsec"><h4>有問題</h4>
<p>找老師反應就可以了。</p></div>`;

/* ---------- 事件 ---------- */
$('#tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t) openSong(t.dataset.id);
});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===c)));
  renderIndex();
}));
$('#bSearch').addEventListener('click',()=>{
  const hid=$('#searchRow').classList.toggle('hidden');
  $('#bSearch').setAttribute('aria-pressed',String(!hid));
  if(!hid) $('#q').focus(); else { query=''; $('#q').value=''; renderIndex(); }
});
$('#q').addEventListener('input',e=>{ query=e.target.value; renderIndex(); });

$('#bBack').addEventListener('click',closeSong);
$('#bPrev').addEventListener('click',()=>flip(-1));
$('#bNext').addEventListener('click',()=>flip(1));
$('#bDown').addEventListener('click',()=>bump(-1));
$('#bUp').addEventListener('click',()=>bump(1));
$('#bReset').addEventListener('click',()=>{ st(order[idx].id).steps=0; renderSheet(); });
$('#bA1').addEventListener('click',()=>size(-1));
$('#bA2').addEventListener('click',()=>size(1));
$('#bMode').addEventListener('click',()=>setMode('img'));
$('#bMode2').addEventListener('click',()=>setMode('text'));
$('#bSave').addEventListener('click',save);

$('#bHelp').addEventListener('click',()=>openDrawer(HELP));
[$('#bAsk'),$('#bAsk2')].forEach(b=>b.addEventListener('click',()=>openDrawer(ASK)));

$('#drawer').addEventListener('click',e=>{
  if(e.target===$('#drawer')||e.target.closest('[data-close]')){ closeDrawer(); return; }
  const tab=e.target.closest('.htab');
  if(tab){
    document.querySelectorAll('.htab').forEach(t=>t.setAttribute('aria-pressed',String(t===tab)));
    document.querySelectorAll('.htc').forEach(c=>c.classList.remove('on'));
    const box=document.getElementById('t-'+tab.dataset.tab); if(box) box.classList.add('on');
    return;
  }
  if(e.target.closest('#askSend')) sendRequest();
});
$('#drawer').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='askInput'){ e.preventDefault(); sendRequest(); }
});

async function sendRequest(){
  const input=document.getElementById('askInput');
  const btn=document.getElementById('askSend');
  const out=document.getElementById('askStatus');
  if(!input||!btn||!out) return;
  const name=input.value.trim();
  if(!name){ out.className='status err'; out.textContent='先輸入歌名'; input.focus(); return; }
  btn.disabled=true; btn.textContent='送出中…'; out.className='status'; out.textContent='';
  try{
    const d=await(await fetch(BASE+'?api=request&song='+encodeURIComponent(name))).json();
    if(d.success){
      out.className='status ok';
      out.textContent = d.duplicated ? '這首剛剛已經登記過了，老師收到囉' : '送出成功，老師收到囉';
      input.value='';
      setTimeout(closeDrawer,1400);
    } else { out.className='status err'; out.textContent='送不出去：'+(d.error||'後端回報失敗'); }
  }catch(e){ out.className='status err'; out.textContent='連不上：'+e.message; }
  btn.disabled=false; btn.textContent='送出';
}

document.addEventListener('keydown',e=>{
  if(!$('#drawer').hidden){ if(e.key==='Escape') closeDrawer(); return; }
  if($('#sheetView').hidden) return;
  if(e.key==='Escape') closeSong();
  else if(e.key==='ArrowRight') flip(1);
  else if(e.key==='ArrowLeft') flip(-1);
  else if(e.key==='+'||e.key==='=') bump(1);
  else if(e.key==='-') bump(-1);
});

let sx=0,sy=0,tracking=false;
const stage=$('#stage');
stage.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
},{passive:true});
stage.addEventListener('touchend',e=>{
  if(!tracking) return; tracking=false;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.8) flip(dx<0?1:-1);
},{passive:true});

/* 第一次來自動開說明 */
const HELP_KEY='baowarriors_help_v3';
try{ if(!localStorage.getItem(HELP_KEY)){ setTimeout(()=>openDrawer(HELP),500); } }catch(e){}
$('#drawer').addEventListener('click',()=>{ try{ localStorage.setItem(HELP_KEY,'1'); }catch(e){} });

load();
</script>
